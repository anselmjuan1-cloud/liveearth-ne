# Worker fleet: GitHub Actions, not Vercel cron (Hobby cron is once/day).
name: discover
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch prior state
        run: bash scripts/fetch-data.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Ingest DOT camera feeds
        run: npm run discover
      - name: Publish
        run: bash scripts/publish-data.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
